name: Pinned HTTPS Coverage

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  exact-pinned-https-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install hash-locked test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt

      - name: Run DNS-pinned HTTPS contracts
        run: |
          python -m pytest -q \
            tests/test_pinned_https_resolution.py \
            tests/test_pinned_https_redirects.py \
            tests/test_pinned_https_cli_integration.py \
            tests/test_pinned_https_validation_edges.py \
            tests/test_pinned_https_coverage_edges.py \
            tests/test_pinned_https_release_contract.py \
            tests/test_ssrf_protection.py

      - name: Verify exact unrounded statement coverage
        run: |
          python -m scripts.ci.verify_module_coverage \
            --module appguardrail_core/pinned_https.py \
            --test tests/test_pinned_https_resolution.py \
            --test tests/test_pinned_https_redirects.py \
            --test tests/test_pinned_https_cli_integration.py \
            --test tests/test_pinned_https_validation_edges.py \
            --test tests/test_pinned_https_coverage_edges.py \
            --test tests/test_pinned_https_release_contract.py
