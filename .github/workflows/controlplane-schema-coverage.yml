name: Control-plane Schema Coverage

on:
  push:
    branches: [develop, main]
    paths:
      - "appguardrail_core/controlplane_schema.py"
      - "appguardrail_core/__init__.py"
      - "tests/test_controlplane_schema_*.py"
      - "docs/controlplane-schema-migration.md"
      - "CHANGELOG.d/871-retention-schema-migration.md"
      - ".github/workflows/controlplane-schema-coverage.yml"
  pull_request:
    paths:
      - "appguardrail_core/controlplane_schema.py"
      - "appguardrail_core/__init__.py"
      - "tests/test_controlplane_schema_*.py"
      - "docs/controlplane-schema-migration.md"
      - "CHANGELOG.d/871-retention-schema-migration.md"
      - ".github/workflows/controlplane-schema-coverage.yml"

permissions:
  contents: read

concurrency:
  group: controlplane-schema-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-controlplane-schema-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install hash-locked test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt
      - name: Run schema migration contracts
        run: |
          python -m pytest -q \
            tests/test_controlplane_schema_migration.py \
            tests/test_controlplane_schema_failure_edges.py \
            tests/test_controlplane_schema_contract.py \
            tests/test_controlplane_schema_coverage_edges.py \
            tests/test_controlplane_schema_release_contract.py
      - name: Verify exact unrounded statement coverage
        run: |
          python -m scripts.ci.verify_module_coverage \
            --module appguardrail_core/controlplane_schema.py \
            --test tests/test_controlplane_schema_migration.py \
            --test tests/test_controlplane_schema_failure_edges.py \
            --test tests/test_controlplane_schema_contract.py \
            --test tests/test_controlplane_schema_coverage_edges.py \
            --test tests/test_controlplane_schema_release_contract.py
