name: OpenSSF Evidence Coverage

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  exact-openssf-evidence-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install hash-locked test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt

      - name: Run OpenSSF evidence tests
        run: |
          python -m pytest -q \
            tests/test_openssf_evidence.py \
            tests/test_openssf_evidence_transport.py \
            tests/test_openssf_evidence_cli.py \
            tests/test_openssf_evidence_report.py \
            tests/test_openssf_evidence_release_contract.py \
            tests/test_openssf_evidence_coverage_edges.py \
            tests/test_openssf_evidence_validation_edges.py

      - name: Verify exact unrounded statement coverage
        run: |
          python -m scripts.ci.verify_module_coverage \
            --module appguardrail_core/__init__.py \
            --module appguardrail_core/openssf_evidence.py \
            --module appguardrail_core/openssf_report.py \
            --test tests/test_openssf_evidence.py \
            --test tests/test_openssf_evidence_transport.py \
            --test tests/test_openssf_evidence_cli.py \
            --test tests/test_openssf_evidence_report.py \
            --test tests/test_openssf_evidence_release_contract.py \
            --test tests/test_openssf_evidence_coverage_edges.py \
            --test tests/test_openssf_evidence_validation_edges.py
