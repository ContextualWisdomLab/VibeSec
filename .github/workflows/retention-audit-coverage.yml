name: Retention Audit Coverage

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: retention-audit-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-retention-audit-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install hash-locked test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt

      - name: Run retention and audit core tests
        run: |
          python -m pytest -q \
            tests/test_audit_events.py \
            tests/test_audit_checkpoint_edges.py \
            tests/test_retention_policy.py \
            tests/test_retention_policy_edges.py \
            tests/test_retention_audit_release_contract.py \
            tests/test_module_coverage_gate_contract.py

      - name: Verify exact unrounded statement coverage
        run: |
          python -m scripts.ci.verify_module_coverage \
            --module appguardrail_core/audit_events.py \
            --module appguardrail_core/retention_policy.py \
            --test tests/test_audit_events.py \
            --test tests/test_audit_checkpoint_edges.py \
            --test tests/test_retention_policy.py \
            --test tests/test_retention_policy_edges.py \
            --test tests/test_retention_audit_release_contract.py \
            --test tests/test_module_coverage_gate_contract.py
