name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && github.event.pull_request.draft == false) }}
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        # Hash-pinned per OpenSSF Scorecard Pinned-Dependencies. Recompile with:
        # uv pip compile --generate-hashes --universal --python-version 3.11 requirements-test.in -o requirements-test.txt
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Verify 100% statement coverage for live drift modules
        if: matrix.python-version == '3.13'
        run: |
          python -m scripts.ci.verify_module_coverage \
            --module appguardrail_core/code_scanning.py \
            --module scripts/ci/collect_code_scanning_drift.py \
            --test tests/test_code_scanning_core.py \
            --test tests/test_code_scanning_coverage_edges.py \
            --test tests/test_code_scanning_drift_collector.py \
            --test tests/test_code_scanning_drift_issueops.py \
            --test tests/test_code_scanning_drift_release_contract.py \
            --test tests/test_code_scanning_drift_transport_edges.py \
            --test tests/test_code_scanning_drift_workflow.py \
            --test tests/test_code_scanning_module_entrypoint.py \
            --test tests/test_code_scanning_operational_hardening.py \
            --test tests/test_code_scanning_page_result_issue_index.py \
            --test tests/test_code_scanning_remaining_coverage.py \
            --test tests/test_code_scanning_review_regressions.py
      - name: Verify consolidated exact module coverage
        if: matrix.python-version == '3.13'
        run: |
          python -m scripts.ci.verify_module_coverage \
            --module scripts/ci/commercial_readiness_loop.py \
            --module scripts/ci/commercial_readiness_reconcile.py \
            --test tests/test_commercial_readiness_loop.py \
            --test tests/test_commercial_readiness_loop_handoff.py \
            --test tests/test_commercial_readiness_reconcile.py \
            --test tests/test_commercial_readiness_coverage_edges.py \
            --test tests/test_opencode_commercial_agent_trust_boundary.py \
            --test tests/test_opencode_commercial_agent_coverage_contract.py
          python -m scripts.ci.verify_module_coverage \
            --module appguardrail_core/controlplane_schema.py \
            --test tests/test_controlplane_schema_migration.py \
            --test tests/test_controlplane_schema_failure_edges.py \
            --test tests/test_controlplane_schema_contract.py \
            --test tests/test_controlplane_schema_coverage_edges.py \
            --test tests/test_controlplane_schema_release_contract.py
          python -m scripts.ci.verify_module_coverage \
            --module appguardrail_core/__init__.py \
            --module appguardrail_core/openssf_evidence.py \
            --module appguardrail_core/openssf_report.py \
            --test tests/test_openssf_evidence.py \
            --test tests/test_openssf_evidence_transport.py \
            --test tests/test_openssf_evidence_cli.py \
            --test tests/test_openssf_evidence_report.py \
            --test tests/test_openssf_evidence_release_contract.py \
            --test tests/test_openssf_evidence_coverage_edges.py \
            --test tests/test_openssf_evidence_validation_edges.py
          python -m scripts.ci.verify_module_coverage \
            --module appguardrail_core/pinned_https.py \
            --test tests/test_pinned_https_resolution.py \
            --test tests/test_pinned_https_redirects.py \
            --test tests/test_pinned_https_cli_integration.py \
            --test tests/test_pinned_https_validation_edges.py \
            --test tests/test_pinned_https_coverage_edges.py \
            --test tests/test_pinned_https_release_contract.py
          python -m scripts.ci.verify_module_coverage \
            --module appguardrail_core/audit_events.py \
            --module appguardrail_core/retention_policy.py \
            --test tests/test_audit_events.py \
            --test tests/test_audit_checkpoint_edges.py \
            --test tests/test_retention_policy.py \
            --test tests/test_retention_policy_edges.py \
            --test tests/test_retention_audit_release_contract.py \
            --test tests/test_module_coverage_gate_contract.py
          python -m scripts.ci.verify_module_coverage \
            --module appguardrail_core/scan_paths.py \
            --test tests/test_scan_path_context_core.py \
            --test tests/test_scan_path_context_integration.py \
            --test tests/test_auth_deferral_comment_rule.py \
            --test tests/test_scan_path_context_release_contract.py
