name: Commercial Readiness Agent Coverage

on:
  push:
    branches: [develop, main]
    paths:
      - "scripts/ci/commercial_readiness_loop.py"
      - "scripts/ci/commercial_readiness_reconcile.py"
      - "tests/test_commercial_readiness_loop.py"
      - "tests/test_commercial_readiness_loop_handoff.py"
      - "tests/test_commercial_readiness_reconcile.py"
      - "tests/test_commercial_readiness_coverage_edges.py"
      - "tests/test_opencode_commercial_agent_trust_boundary.py"
      - "tests/test_opencode_commercial_agent_coverage_contract.py"
      - "docs/commercial-readiness-loop.md"
      - "docs/opencode-commercial-readiness-agent.md"
      - "docs/superpowers/plans/2026-08-06-opencode-commercial-readiness-agent.md"
      - "CHANGELOG.d/872-opencode-commercial-agent.md"
      - "opencode.jsonc"
      - ".github/workflows/commercial-readiness-loop.yml"
      - ".github/workflows/commercial-readiness-agent-coverage.yml"
  pull_request:
    paths:
      - "scripts/ci/commercial_readiness_loop.py"
      - "scripts/ci/commercial_readiness_reconcile.py"
      - "tests/test_commercial_readiness_loop.py"
      - "tests/test_commercial_readiness_loop_handoff.py"
      - "tests/test_commercial_readiness_reconcile.py"
      - "tests/test_commercial_readiness_coverage_edges.py"
      - "tests/test_opencode_commercial_agent_trust_boundary.py"
      - "tests/test_opencode_commercial_agent_coverage_contract.py"
      - "docs/commercial-readiness-loop.md"
      - "docs/opencode-commercial-readiness-agent.md"
      - "docs/superpowers/plans/2026-08-06-opencode-commercial-readiness-agent.md"
      - "CHANGELOG.d/872-opencode-commercial-agent.md"
      - "opencode.jsonc"
      - ".github/workflows/commercial-readiness-loop.yml"
      - ".github/workflows/commercial-readiness-agent-coverage.yml"

permissions:
  contents: read

concurrency:
  group: commercial-readiness-agent-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-commercial-agent-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install hash-locked test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-test.txt
      - name: Run commercial-agent contracts
        run: |
          python -m pytest -q \
            tests/test_commercial_readiness_loop.py \
            tests/test_commercial_readiness_loop_handoff.py \
            tests/test_commercial_readiness_reconcile.py \
            tests/test_commercial_readiness_coverage_edges.py \
            tests/test_opencode_commercial_agent_trust_boundary.py \
            tests/test_opencode_commercial_agent_coverage_contract.py
      - name: Verify exact unrounded statement coverage
        run: |
          python -m scripts.ci.verify_module_coverage \
            --module scripts/ci/commercial_readiness_loop.py \
            --module scripts/ci/commercial_readiness_reconcile.py \
            --test tests/test_commercial_readiness_loop.py \
            --test tests/test_commercial_readiness_loop_handoff.py \
            --test tests/test_commercial_readiness_reconcile.py \
            --test tests/test_commercial_readiness_coverage_edges.py \
            --test tests/test_opencode_commercial_agent_trust_boundary.py \
            --test tests/test_opencode_commercial_agent_coverage_contract.py
