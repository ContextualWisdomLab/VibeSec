<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AppGuardrail Dashboard</title>
<!--
  Single-file viewer for `appguardrail.findings.v1` JSON.
  Generate input with:  appguardrail scan --findings-json reports/findings.json .
  Then serve it with:    appguardrail dashboard
  (or open this file directly and drag a findings.json onto the window).
  ponytail: no framework, no build step. Renders the schema in appguardrail_core/findings.py verbatim.
-->
<style>
  /* Fallback tokens — keep the page styled if /tokens.css is unavailable.
     The canonical source is scanner/dashboard/tokens.json, served at
     /tokens.css (linked after this block so served values win). */
  :root{
    --bg:#F4F5F7; --surface:#FFFFFF; --text:#1A1D24; --muted:#5B6472;
    --border:#D6DAE0; --divider:#E7EAEF; --primary:#256EF4; --on-primary:#fff;
    --crit:#D93B3B; --high:#E06C00; --warn:#B7791F; --info:#5B6472;
    --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text)}
  header{display:flex;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;position:sticky;top:0;z-index:5}
  .logo{width:26px;height:26px;border-radius:6px;background:var(--primary)}
  .brand{font-weight:700;font-size:16px}
  header .spacer{flex:1}
  header .meta{color:var(--muted);font-size:12px}
  main{max-width:1200px;margin:0 auto;padding:24px}
  h1{font-size:24px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 20px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:20px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
  .card .n{font-size:30px;font-weight:700}
  .card .lbl{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600;font-size:13px}
  .dot{width:10px;height:10px;border-radius:50%}
  .grid2{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .panel h2{font-size:15px;margin:0;padding:16px 18px 8px}
  .rowlist div.r{display:flex;align-items:center;gap:8px;padding:10px 18px;border-bottom:1px solid var(--divider)}
  .rowlist div.r:last-child{border-bottom:0}
  .rowlist .r .name{flex:1}
  .rowlist .r .cnt{background:var(--bg);border-radius:999px;padding:2px 9px;font-weight:600;font-size:12px;color:var(--muted)}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  input[type=search],select{padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font:inherit;color:var(--text)}
  input[type=search]{flex:1;min-width:160px}
  table{width:100%;border-collapse:collapse;background:var(--surface)}
  th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--divider);vertical-align:top}
  thead th{color:var(--muted);font-size:12px;font-weight:600;background:var(--bg)}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--bg)}
  tbody tr:focus-visible{background:var(--bg);outline-offset:-2px}
  .chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
  .file{color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .tag{display:inline-block;padding:1px 8px;border-radius:6px;border:1px solid var(--border);font-size:11px;color:var(--muted)}
  .tag.block{border-color:var(--crit);color:var(--crit);font-weight:600}
  dialog{border:none;border-radius:14px;padding:0;max-width:720px;width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  dialog::backdrop{background:rgba(20,23,30,.5)}
  .dlg-head{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--divider)}
  .dlg-head .t{flex:1;font-size:18px;font-weight:700}
  .dlg-head button{border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background 0.2s, color 0.2s}
  .dlg-head button:hover{background:var(--bg);color:var(--text)}
  .dlg-head button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .dlg-body{padding:6px 22px 22px}
  .sec{border:1px solid var(--border);border-left-width:4px;border-radius:8px;padding:14px 16px;margin-top:14px}
  .sec h3{margin:0 0 6px;font-size:12px;letter-spacing:.4px;text-transform:uppercase}
  .sec.problem{border-left-color:var(--crit)} .sec.problem h3{color:var(--crit)}
  .sec.fix{border-left-color:var(--primary)} .sec.fix h3{color:var(--primary)}
  .sec.verify{border-left-color:#1E874B} .sec.verify h3{color:#1E874B}
  .sec.meta{border-left-color:var(--muted)} .sec.meta h3{color:var(--muted)}
  pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px}
  .kv{color:var(--muted);font-size:12px}
  .empty{background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);padding:40px;text-align:center;color:var(--muted)}
  .empty code{background:var(--bg);padding:2px 6px;border-radius:4px;color:var(--text)}
  .primary-action{min-height:44px;padding:10px 16px;border:1px solid var(--primary);border-radius:8px;background:var(--primary);color:var(--on-primary);cursor:pointer;font:inherit;font-weight:700}
  .primary-action:hover{filter:brightness(.94)}
  .drop{margin-top:14px}
  body.drag-active::after{content:"Drop findings.json here";position:fixed;inset:0;z-index:99;background:rgba(37,110,244,.08);border:4px dashed var(--primary);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--primary);pointer-events:none;backdrop-filter:blur(2px)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  a{color:var(--primary)}
  .skip-link{position:absolute;top:-48px;left:0;background:var(--primary);color:#fff;padding:8px 16px;z-index:100;font-weight:700;border-radius:0 0 8px 0;transition:top .2s}\n  .skip-link:focus{top:0;outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 5px var(--primary)}\n</style>
<!-- Canonical design tokens (scanner/dashboard/tokens.json) served at /tokens.css;
     loaded last so served values override the inline fallback above. -->
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<a href="#app" class="skip-link">Skip to content</a>
<header>
  <span class="logo"></span><span class="brand">AppGuardrail</span>
  <span class="spacer"></span>
  <span class="meta" id="src">no findings loaded</span>
  <button type="button" id="header-browse" class="primary-action" style="margin-left:12px">Upload findings file</button>
  <input type="file" id="file" accept="application/json,.json" hidden>
</header>
<p id="findings-summary" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
<main id="app" tabindex="-1"></main>

<dialog id="detail" aria-labelledby="dlg-title"></dialog>

<script>
const SEV = {
  CRITICAL:{color:'var(--crit)'}, HIGH:{color:'var(--high)'},
  WARNING:{color:'var(--warn)'}, INFO:{color:'var(--info)'}
};
const SEV_ORDER = ['CRITICAL','HIGH','WARNING','INFO'];
const NON_BLOCKING = new Set(['doc','test','example','scanner-fixture']);
const BLOCKING_SEV = new Set(['CRITICAL','HIGH']);

// mirrors appguardrail_core.findings.is_deploy_blocking
function isDeployBlocking(f){
  const sev = String(f.severity||'INFO').toUpperCase();
  const ctx = String(f.context||'app-code');
  return BLOCKING_SEV.has(sev) && !NON_BLOCKING.has(ctx);
}
function formatFindingCount(count){
  return `${count} ${count === 1 ? 'finding' : 'findings'}`;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"'`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));}
function safeUrl(u){
  if (typeof u === 'string' && u.startsWith('//')) {
    return '#';
  }
  try {
    const parsed = new URL(u, window.location.href);
    if (parsed.protocol === 'http:' || parsed.protocol === 'https:') return u;
  } catch(e){}
  return '#';
}

let ALL = null;
let filterSev = '', query = '';
let lastFocus = null;

function render(){
  const activeElement = document.activeElement;
  const activeId = activeElement?.id || null;
  const activeSelection = activeId === 'q' && typeof activeElement.selectionStart === 'number'
    ? {start: activeElement.selectionStart, end: activeElement.selectionEnd}
    : null;
  const app = document.getElementById('app');
  const liveSummary = document.getElementById('findings-summary');
  if(!ALL){
    if (liveSummary) liveSummary.textContent = '';
    app.innerHTML = `<div class="empty">
      <h1>No findings loaded</h1>
      <p>Generate a report-safe findings file, then load it above (or place it next to this page).</p>
      <p><code>appguardrail scan --findings-json reports/findings.json .</code></p>
      <p id="findings-upload-help" class="drop">Serve the repo (<code>python3 -m http.server</code>) and open <code>/dashboard/</code>, or drag a <code>findings.json</code> onto this window.</p>
      <p><button type="button" id="browse-findings" class="primary-action" aria-describedby="findings-upload-help">Browse findings.json</button></p>
    </div>`;
    const browseFindings = document.getElementById('browse-findings');
    const fileInput = document.getElementById('file');
    browseFindings.addEventListener('click', () => fileInput.click());
    return;
  }
  if(ALL.length === 0){
    if (liveSummary) liveSummary.textContent = 'Clean scan · 0 findings · deploy gate clear';
    app.innerHTML = `<div class="empty">
      <h1>Clean scan</h1>
      <p>No findings were detected in this report. The deploy gate is clear.</p>
      <p id="findings-upload-help" class="drop">Load a different <code>findings.json</code> file to review another report.</p>
      <p><button type="button" id="browse-findings" class="primary-action" aria-describedby="findings-upload-help">Browse findings.json</button></p>
    </div>`;
    const browseFindings = document.getElementById('browse-findings');
    const fileInput = document.getElementById('file');
    browseFindings.addEventListener('click', () => fileInput.click());
    return;
  }
  const counts = {CRITICAL:0,HIGH:0,WARNING:0,INFO:0};
  const byCat = {};
  let blocking = 0;
  for(const f of ALL){
    const s = String(f.severity||'INFO').toUpperCase();
    counts[s in counts ? s : 'INFO']++;
    const c = String(f.category||'misconfig');
    byCat[c] = (byCat[c]||0)+1;
    if(isDeployBlocking(f)) blocking++;
  }
  const cards = SEV_ORDER.map(s=>{
    const isSelected = filterSev === s;
    const style = isSelected ? 'border-color:var(--primary); box-shadow:0 0 0 1px var(--primary); cursor:pointer;' : 'cursor:pointer;';
    return `
    <div class="card" role="button" tabindex="0" aria-label="Filter by ${s}: ${counts[s]}" aria-pressed="${isSelected}" onclick="document.getElementById('sev').value='${isSelected ? '' : s}'; document.getElementById('sev').dispatchEvent(new Event('change'));" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault(); this.click();}" style="${style}">
      <div class="lbl"><span class="dot" style="background:${SEV[s].color}"></span>${s}</div>
      <div class="n">${counts[s]}</div>
    </div>`;
  }).join('');
  const catRows = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,n])=>
    `<div class="r"><span class="name">${esc(c)}</span><span class="cnt">${n}</span></div>`).join('');

  const filtered = ALL
    .map((f,i)=>({f,i}))
    .filter(({f})=> (!filterSev || String(f.severity).toUpperCase()===filterSev))
    .filter(({f})=> !query || (String(f.message)+' '+String(f.file)+' '+String(f.rule_id)+' '+String(f.category)).toLowerCase().includes(query))
    .sort((a,b)=> SEV_ORDER.indexOf(String(a.f.severity).toUpperCase()) - SEV_ORDER.indexOf(String(b.f.severity).toUpperCase()));
  const allFindingsText = formatFindingCount(ALL.length);
  const findingsText = filtered.length === ALL.length
    ? allFindingsText
    : `${filtered.length} of ${allFindingsText}`;
  const gateText = `${blocking} deploy-blocking (gate ${blocking?'active':'clear'})`;
  const summaryText = `${findingsText} · ${gateText}`;

  const rows = filtered.map(({f,i})=>{
    const s = String(f.severity||'INFO').toUpperCase();
    const block = isDeployBlocking(f);
    return `<tr data-i="${i}" tabindex="0" role="button" aria-haspopup="dialog" title="View details for finding">
      <td><span class="chip" style="background:${SEV[s]?SEV[s].color:'var(--info)'}">${esc(s)}</span></td>
      <td>${esc(f.message)}</td>
      <td class="file">${esc(f.file)}:${esc(f.line)}</td>
      <td>${esc(f.category)}</td>
      <td>${block?'<span class="tag block">deploy-blocking</span>':'<span class="tag">'+esc(f.context||'app-code')+'</span>'}</td>
    </tr>`;
  }).join('');

  app.innerHTML = `
    <h1>Dashboard</h1>
    <p class="sub">${findingsText} · <strong>${blocking}</strong> deploy-blocking (gate ${blocking?'active':'clear'})</p>
    <div class="cards">${cards}
      <div class="card"><div class="lbl"><span class="dot" style="background:var(--primary)"></span>Deploy-blocking</div><div class="n">${blocking}</div></div>
    </div>
    <div class="grid2">
      <div class="panel"><h2>Findings by category</h2><div class="rowlist">${catRows||'<div class="r">—</div>'}</div></div>
      <div>
        <div class="toolbar">
          <input type="search" id="q" placeholder="Search message, file, rule, category" title="Press / to search" aria-keyshortcuts="/" aria-label="Search findings" value="${esc(query)}">
          <select id="sev" aria-label="Filter by severity">
            <option value="">All severities</option>
            ${SEV_ORDER.map(s=>`<option value="${s}" ${s===filterSev?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
        <div class="panel"><table>
          <thead><tr><th scope="col">Severity</th><th scope="col">Finding</th><th scope="col">File</th><th scope="col">Category</th><th scope="col">Status</th></tr></thead>
          <tbody>${rows||`<tr><td colspan="5" style="padding:32px 24px;text-align:center">
          <div style="color:var(--text);font-weight:600;font-size:14px;margin-bottom:8px">No findings match the filter</div>
          <button type="button" aria-label="Clear filters" onclick="query=''; filterSev=''; render(); document.getElementById('q')?.focus();" style="padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font:inherit;color:var(--text);font-weight:500;transition:background 0.2s">Clear filters</button>
        </td></tr>`}</tbody>
        </table></div>
      </div>
    </div>`;

  if (liveSummary && liveSummary.textContent !== summaryText) {
    liveSummary.textContent = summaryText;
  }

  document.getElementById('q').addEventListener('input', e=>{
    query = e.target.value.toLowerCase();
    render();
  });
  document.getElementById('q').addEventListener('keydown', e=>{
    if (e.key === 'Escape') {
      e.preventDefault();
      e.target.value = '';
      query = '';
      render();
    }
  });
  document.getElementById('sev').addEventListener('change', e=>{filterSev=e.target.value;render();});
  app.querySelectorAll('tbody tr[data-i]').forEach(tr=>{
    const open = () => openDetail(ALL[+tr.dataset.i]);
    tr.addEventListener('click', open);
    tr.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        open();
      }
    });
  });

  const restoredElement = activeId ? document.getElementById(activeId) : null;
  if (restoredElement) {
    restoredElement.focus();
    if (activeSelection && typeof restoredElement.setSelectionRange === 'function') {
      restoredElement.setSelectionRange(activeSelection.start, activeSelection.end);
    }
  }
}

function openDetail(f){
  lastFocus = document.activeElement;
  const s = String(f.severity||'INFO').toUpperCase();
  const refs = (f.references||[]).map(r=>`<a href="${esc(safeUrl(r))}" target="_blank" rel="noopener">${esc(r)}</a>`).join('<br>');
  const owasp = (f.owasp||[]).join(', ');
  const cwe = (f.cwe||[]).join(', ');
  const d = document.getElementById('detail');

  d.innerHTML = `
    <div class="dlg-head">
      <span class="chip" style="background:${SEV[s]?SEV[s].color:'var(--info)'}">${esc(s)}</span>
      <span class="t" id="dlg-title">${esc(f.rule_id)}</span>
      <button aria-label="Close" title="Close (Esc)" onclick="document.getElementById('detail').close()">✕</button>
    </div>
    <div class="dlg-body">
      <p class="file">${esc(f.file)}:${esc(f.line)} · ${esc(f.category)} · context: ${esc(f.context||'app-code')}${isDeployBlocking(f)?' · <span class="tag block">deploy-blocking</span>':''}</p>
      <div class="sec problem"><h3>Problem</h3><div>${esc(f.message)}</div></div>
      <div class="sec fix"><h3>Fix Prompt</h3><pre>${esc(f.remediation)}</pre></div>
      <div class="sec verify"><h3>Verification</h3><pre>${esc(f.verification)}</pre></div>
      ${f.snippet?`<div class="sec meta"><h3>Evidence</h3><pre>${esc(f.snippet)}</pre></div>`:''}
      ${(owasp||cwe||refs)?`<div class="sec meta"><h3>References</h3>
        ${owasp?`<div class="kv">OWASP: ${esc(owasp)}</div>`:''}
        ${cwe?`<div class="kv">CWE: ${esc(cwe)}</div>`:''}
        ${refs?`<div style="margin-top:6px">${refs}</div>`:''}</div>`:''}
    </div>`;
  d.showModal();
}

// Dialog event listeners for a11y and UX
const detailDialog = document.getElementById('detail');
detailDialog.addEventListener('close', () => {
  if (lastFocus) lastFocus.focus();
});
detailDialog.addEventListener('click', (e) => {
  if (e.target === detailDialog) detailDialog.close();
});

function load(data, srcLabel){
  // Accept the v1 envelope, a raw array, or any object with a `findings` array.
  let findings = Array.isArray(data) ? data : (data && Array.isArray(data.findings) ? data.findings : null);
  if(!findings){ alert('Not an AppGuardrail findings file (expected {"findings":[...]} or an array).'); return; }
  ALL = findings;
  document.getElementById('src').textContent = `${srcLabel} · ${formatFindingCount(findings.length)}${data.schema?` · ${data.schema}`:''}`;
  render();
}

const fileInput = document.getElementById('file');
document.getElementById('header-browse').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  const selectedFile = fileInput.files?.[0];
  fileInput.value = '';
  if(!selectedFile) return;
  selectedFile.text().then(t=>{ try{ load(JSON.parse(t), selectedFile.name); }catch(err){ alert('Invalid JSON: '+err.message); } });
});
// drag & drop
let dragDepth = 0;
const isFileDrag = e => Array.from(e.dataTransfer?.types || []).includes('Files');
addEventListener("dragenter", e => {
  e.preventDefault();
  if (!isFileDrag(e)) return;
  dragDepth += 1;
  document.body.classList.add("drag-active");
});
addEventListener("dragover", e => e.preventDefault());
addEventListener("dragleave", e => {
  if (!isFileDrag(e)) return;
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) document.body.classList.remove("drag-active");
});
addEventListener("drop", e => {
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove("drag-active");
  const f=e.dataTransfer.files[0];
  if(f)f.text().then(t=>{try{load(JSON.parse(t),f.name);}catch(err){alert('Invalid JSON: '+err.message);}});
});

// auto-load if served alongside a findings file
(function autoload(){
  const candidates = ['findings.json','reports/findings.json','../reports/findings.json'];
  (function tryNext(i){
    if(i>=candidates.length){ render(); return; }
    fetch(candidates[i]).then(r=>r.ok?r.json():Promise.reject()).then(d=>load(d,candidates[i])).catch(()=>tryNext(i+1));
  })(0);
})();

// Global keyboard shortcuts
addEventListener("keydown", e => {
  if (e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey) {
    if (e.defaultPrevented) return;
    const el = document.activeElement;
    const tag = el?.tagName?.toLowerCase();
    if (tag !== 'input' && tag !== 'textarea' && tag !== 'select' && !el?.isContentEditable) {
      e.preventDefault(); // prevent e.g. quick find
      document.getElementById('q')?.focus();
    }
  }
});

// ponytail self-check: deploy-blocking gate mirrors the Python contract
(function selftest(){
  const cases = [
    [{severity:'CRITICAL',context:'app-code'}, true],
    [{severity:'HIGH',context:'test'}, false],
    [{severity:'WARNING',context:'app-code'}, false],
    [{severity:'CRITICAL',context:'example'}, false],
  ];
  for(const [f,expect] of cases){
    if(isDeployBlocking(f)!==expect) console.error('selftest FAIL', f, 'expected', expect);
  }
})();
</script>
</body>
</html>
