rules:
  # A repository-local SARIF upload workflow needs a pull-request entry point
  # unless PR analysis is intentionally delegated to a centrally managed
  # required workflow. Delegated workflows can opt out explicitly with the
  # top-level marker documented in the remediation below.
  # The matcher accepts compact `- uses:` steps and multi-line action steps
  # where ordinary step metadata precedes `uses`, while rejecting action-like
  # text nested inside shell `run` blocks.

  - id: github-actions-sarif-missing-pull-request-trigger
    patterns:
      - pattern-regex: '\A(?=[\s\S]*(?:^[ \t]+-[ \t]*["'']?uses["'']?[ \t]*:[ \t]*["'']?(?i:github/codeql-action/upload-sarif)@|^(?P<step_indent>[ \t]+)-[ \t]*(?![ \t]*["'']?(?:run|uses)["'']?[ \t]*:)[^\n]*\n(?:(?P=step_indent)[ \t]+(?![ \t]*["'']?run["'']?[ \t]*:)[^\n]*\n){0,8}(?P=step_indent)[ \t]+["'']?uses["'']?[ \t]*:[ \t]*["'']?(?i:github/codeql-action/upload-sarif)@))(?![\s\S]*^#[ \t]*appguardrail:[ \t]*central-code-scanning[ \t]*$)(?![\s\S]*^["'']?on["'']?[ \t]*:[ \t]*(?:(?:["'']?(?:pull_request(?:_target)?|workflow_call)\b["'']?)|\[[^#\n]*\b(?:pull_request(?:_target)?|workflow_call)\b|\{[^#\n]*\b(?:pull_request(?:_target)?|workflow_call)\b|(?:#[^\n]*)?\n(?:(?:[ \t]+[^\n]*\n)|(?:[ \t]*\n))*[ \t]+["'']?(?:pull_request(?:_target)?|workflow_call)\b["'']?[ \t]*:))[\s\S]*\Z'
    message: |
      This repository-local GitHub Actions workflow uploads SARIF but has no
      pull_request, pull_request_target, or reusable workflow_call entry point.
      Without a separate PR scanner, GitHub Code Scanning cannot provide
      comparable current-head analysis for this configuration. Prefer a
      pull_request trigger. Use pull_request_target only for trusted-base,
      metadata-only jobs that never check out or execute contributor-controlled
      code; otherwise it can expose write-scoped tokens and secrets. A reusable
      workflow must be called from a PR-triggered workflow. If organization
      policy intentionally delegates PR analysis to a central required workflow,
      verify that workflow covers this SARIF tool/category and add the exact
      top-level line `# appguardrail: central-code-scanning` at column zero.
      Keep SARIF tool/category identifiers stable across branch and PR runs.
    severity: WARNING
    languages: [generic]
    cwe: [CWE-693]
    owasp: [A05:2021]
    paths:
      include:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"

  # A transport-failure counter is not a total polling bound. The verified
  # ContextualWisdomLab/.github incident kept every API request successful while
  # no review verdict arrived, so the loop never incremented its transport
  # failure counter and retained a shared runner for hours. Keep the lightweight
  # detector intentionally bounded to conventional two-space Actions job syntax:
  # all positive evidence must execute inside one literal-shell run block and
  # gh/sleep must occur before that same unbounded loop's `done`. The historical
  # rule also requires the configured transport budget to be wired to a zeroed
  # failure counter, failure-path increment, threshold comparison, and nonzero
  # exit; a merely declared retry setting is not executable safety evidence.
  # Same-job timeout and causally initialized fail-closed deadline/attempt guards
  # are safe boundaries regardless of safety-variable spelling. Forward `-gt`
  # and `-ge` comparisons are both finite; reversed/non-expiring comparisons
  # are not. A statically positive owning-job `timeout-minutes` integer or
  # `${{ N }}` constant expression is a hard bound; zero, negative, empty, and
  # dynamic expressions are not. A bounded helper loop cannot donate safety to
  # a later poll. Uninitialized or post-guard state is not safety evidence, and
  # a healthy path that unconditionally breaks/exits before the back edge is
  # finite.
  - id: github-actions-transport-only-poll-bound
    patterns:
      - pattern-regex: '^  [A-Za-z0-9_.-]+[^\n]*\n(?!(?>(?:(?!^(?:[A-Za-z0-9_.-]+|  [A-Za-z0-9_.-]+)[ \t]*:)[^\n]*\n))*^    timeout-minutes[ \t]*:[ \t]*(?:[1-9][0-9]*|\$\{\{[ \t]*[1-9][0-9]*[ \t]*\}\})[ \t]*(?:#[^\n]*)?$)(?>(?:(?!^      -[ \t]*run|^        run)^ {4,}[^\n]*\n)){0,80}^(?:      -[ \t]*run|        run)[ \t]*:[ \t]*\|[+-]?[^\n]*\n(?=(?>(?:(?!^          [A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*0[ \t]*(?:#[^\n]*)?$)^ {10,}[^\n]*\n)){0,80}^          (?P<hist_transport_counter>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*0[ \t]*(?:#[^\n]*)?\n(?>(?:(?!^          max_poll_transport_failures)^ {10,}[^\n]*\n)){0,40}^          max_poll_transport_failures[ \t]*=[ \t]*[1-9][0-9]*[^\n]*\n(?>(?:(?!^          while[ \t])^ {10,}[^\n]*\n)){0,40}(?:(?>(?:(?!^          while[ \t])^ {10,}[^\n]*\n)){0,40}^          while[ \t]+(?::|true)[ \t]*;[ \t]*do[^\n]*\n(?!(?>(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,80}^ {12,}[^\n]*gh[ \t]+api)(?>(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,80}^          done\b[^\n]*\n)*^          while[ \t]+(?::|true)[ \t]*;[ \t]*do[^\n]*\n(?>(?:(?!^ {12}(?! )if[ \t]+![^\n]*\$\([ \t]*(?:timeout[ \t]+\S+[ \t]+)?gh[ \t]+api\b|^          done\b)^ {12,}[^\n]*\n)){0,80}^ {12}(?! )if[ \t]+![^\n]*\$\([ \t]*(?:timeout[ \t]+\S+[ \t]+)?gh[ \t]+api\b[^\n]*\n(?>(?:(?!^ {14}(?! )(?P=hist_transport_counter)[ \t]*=[ \t]*\$\(\([ \t]*(?P=hist_transport_counter)[ \t]*\+[ \t]*1[ \t]*\)\)|^          done\b)^ {14,}[^\n]*\n)){0,20}^ {14}(?! )(?P=hist_transport_counter)[ \t]*=[ \t]*\$\(\([ \t]*(?P=hist_transport_counter)[ \t]*\+[ \t]*1[ \t]*\)\)[ \t]*(?:#[^\n]*)?\n(?>(?:(?!^ {14}(?! )if[^\n]*\$(?P=hist_transport_counter)[^\n]*-ge[^\n]*\$max_poll_transport_failures\b[^\n]*;[ \t]*then|^          done\b)^ {14,}[^\n]*\n)){0,12}^ {14}(?! )if[^\n]*\$(?P=hist_transport_counter)[^\n]*-ge[^\n]*\$max_poll_transport_failures\b[^\n]*;[ \t]*then[^\n]*\n(?>(?:(?!^ {16}(?! )exit[ \t]+[1-9][0-9]*\b)^ {16,}[^\n]*\n)){0,8}^ {16}(?! )exit[ \t]+[1-9][0-9]*\b[^\n]*\n(?>(?:(?!^ {12}(?! )sleep(?:[ \t]+|$)|^          done\b)^ {12,}[^\n]*\n)){0,80}^ {12}(?! )sleep(?:[ \t]+|$)[^\n]*\n(?!(?>(?:(?!^ {12}(?! )(?:if\b|break(?:[ \t]+[1-9][0-9]*)?\b|exit(?:[ \t]+0)?\b)|^          done\b)^ {12,}[^\n]*\n)){0,40}^ {12}(?! )(?:break(?:[ \t]+[1-9][0-9]*)?|exit(?:[ \t]+0)?)[ \t]*(?:#[^\n]*)?$\n)(?>(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,80}^          done\b)(?>(?:(?!^          max_poll_transport_failures)^ {10,}[^\n]*\n)){0,80}^          max_poll_transport_failures[ \t]*=[ \t]*[1-9][0-9]*[^\n]*\n(?!(?>(?:(?!^          [A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*\$\(\([^\n]*\bdate\b[^\n]*\+%s[^\n]*\+[ \t]*[1-9][0-9]*[ \t]*\)\))^ {10,}[^\n]*\n)){0,80}^          (?P<hist_deadline_any>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*\$\(\([^\n]*\bdate\b[^\n]*\+%s[^\n]*\+[ \t]*[1-9][0-9]*[ \t]*\)\)[ \t]*(?:#[^\n]*)?\n(?>(?:(?!^          while[ \t])^ {10,}[^\n]*\n)){0,40}^          while[ \t]+(?::|true)[ \t]*;[ \t]*do[^\n]*\n(?>(?:(?!^ {12}(?! )if[^\n]*\bdate\b[^\n]*\+%s[^\n]*-(?:gt|ge)[^\n]*\$(?P=hist_deadline_any)\b[^\n]*;[ \t]*then)^ {12,}[^\n]*\n)){0,20}^ {12}(?! )if[^\n]*\bdate\b[^\n]*\+%s[^\n]*-(?:gt|ge)[^\n]*\$(?P=hist_deadline_any)\b[^\n]*;[ \t]*then[^\n]*\n(?>(?:(?!^ {14}(?! )exit[ \t]+[1-9][0-9]*\b)^ {14,}[^\n]*\n)){0,8}^ {14}(?! )exit[ \t]+[1-9][0-9]*\b[^\n]*\n(?>(?:(?!^          done\b|^ {12}(?! )sleep(?:[ \t]+|$))^ {12,}[^\n]*\n)){0,80}^ {12}(?! )sleep(?:[ \t]+|$)[^\n]*\n)(?!(?>(?:(?!^          [A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*0[ \t]*(?:#[^\n]*)?$)^ {10,}[^\n]*\n)){0,80}^          (?P<hist_counter_a>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*0[ \t]*(?:#[^\n]*)?\n(?>(?:(?!^          [A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*[1-9][0-9]*[ \t]*(?:#[^\n]*)?$)^ {10,}[^\n]*\n)){0,40}^          (?P<hist_limit_a>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*[1-9][0-9]*[ \t]*(?:#[^\n]*)?\n(?>(?:(?!^          while[ \t])^ {10,}[^\n]*\n)){0,40}^          while[ \t]+(?::|true)[ \t]*;[ \t]*do[^\n]*\n(?>(?:(?!^ {12}(?! )(?P=hist_counter_a)[ \t]*=[ \t]*\$\(\([ \t]*(?P=hist_counter_a)[ \t]*\+[ \t]*1[ \t]*\)\))^ {12,}[^\n]*\n)){0,20}^ {12}(?! )(?P=hist_counter_a)[ \t]*=[ \t]*\$\(\([ \t]*(?P=hist_counter_a)[ \t]*\+[ \t]*1[ \t]*\)\)[ \t]*(?:#[^\n]*)?\n(?>(?:(?!^ {12}(?! )if[^\n]*\$(?P=hist_counter_a)[^\n]*-(?:gt|ge)[^\n]*\$(?P=hist_limit_a)\b[^\n]*;[ \t]*then)^ {12,}[^\n]*\n)){0,12}^ {12}(?! )if[^\n]*\$(?P=hist_counter_a)[^\n]*-(?:gt|ge)[^\n]*\$(?P=hist_limit_a)\b[^\n]*;[ \t]*then[^\n]*\n(?>(?:(?!^ {14}(?! )exit[ \t]+[1-9][0-9]*\b)^ {14,}[^\n]*\n)){0,8}^ {14}(?! )exit[ \t]+[1-9][0-9]*\b[^\n]*\n(?>(?:(?!^          done\b|^ {12}(?! )sleep(?:[ \t]+|$))^ {12,}[^\n]*\n)){0,80}^ {12}(?! )sleep(?:[ \t]+|$)[^\n]*\n)(?!(?>(?:(?!^          [A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*[1-9][0-9]*[ \t]*(?:#[^\n]*)?$)^ {10,}[^\n]*\n)){0,80}^          (?P<hist_limit_b>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*[1-9][0-9]*[ \t]*(?:#[^\n]*)?\n(?>(?:(?!^          [A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*0[ \t]*(?:#[^\n]*)?$)^ {10,}[^\n]*\n)){0,40}^          (?P<hist_counter_b>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*0[ \t]*(?:#[^\n]*)?\n(?>(?:(?!^          while[ \t])^ {10,}[^\n]*\n)){0,40}^          while[ \t]+(?::|true)[ \t]*;[ \t]*do[^\n]*\n(?>(?:(?!^ {12}(?! )(?P=hist_counter_b)[ \t]*=[ \t]*\$\(\([ \t]*(?P=hist_counter_b)[ \t]*\+[ \t]*1[ \t]*\)\))^ {12,}[^\n]*\n)){0,20}^ {12}(?! )(?P=hist_counter_b)[ \t]*=[ \t]*\$\(\([ \t]*(?P=hist_counter_b)[ \t]*\+[ \t]*1[ \t]*\)\)[ \t]*(?:#[^\n]*)?\n(?>(?:(?!^ {12}(?! )if[^\n]*\$(?P=hist_counter_b)[^\n]*-(?:gt|ge)[^\n]*\$(?P=hist_limit_b)\b[^\n]*;[ \t]*then)^ {12,}[^\n]*\n)){0,12}^ {12}(?! )if[^\n]*\$(?P=hist_counter_b)[^\n]*-(?:gt|ge)[^\n]*\$(?P=hist_limit_b)\b[^\n]*;[ \t]*then[^\n]*\n(?>(?:(?!^ {14}(?! )exit[ \t]+[1-9][0-9]*\b)^ {14,}[^\n]*\n)){0,8}^ {14}(?! )exit[ \t]+[1-9][0-9]*\b[^\n]*\n(?>(?:(?!^          done\b|^ {12}(?! )sleep(?:[ \t]+|$))^ {12,}[^\n]*\n)){0,80}^ {12}(?! )sleep(?:[ \t]+|$)[^\n]*\n)(?>(?:(?!^          while[ \t])^ {10,}[^\n]*\n)){0,80}(?:(?>(?:(?!^          while[ \t])^ {10,}[^\n]*\n)){0,40}^          while[ \t]+(?::|true)[ \t]*;[ \t]*do[^\n]*\n(?!(?>(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,80}^ {12,}[^\n]*gh[ \t]+api)(?>(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,80}^          done\b[^\n]*\n)*^          while[ \t]+(?::|true)[ \t]*;[ \t]*do[^\n]*\n(?>(?:(?!^ {12,}(?:(?:if[ \t]+![ \t]+)?(?:[A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*)?["'']?\$\([ \t]*(?:timeout[ \t]+\S+[ \t]+)?gh[ \t]+api\b|(?:if[ \t]+![ \t]+)?(?:timeout[ \t]+\S+[ \t]+)?gh[ \t]+api\b))^ {12,}[^\n]*\n)){0,80}^ {12,}(?:(?:if[ \t]+![ \t]+)?(?:[A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*)?["'']?\$\([ \t]*(?:timeout[ \t]+\S+[ \t]+)?gh[ \t]+api\b|(?:if[ \t]+![ \t]+)?(?:timeout[ \t]+\S+[ \t]+)?gh[ \t]+api\b)[^\n]*\n(?!(?>(?:(?!^ {12}(?! )(?:if\b|break(?:[ \t]+[1-9][0-9]*)?\b|exit(?:[ \t]+0)?\b))^ {12,}[^\n]*\n)){0,40}^ {12}(?! )(?:break(?:[ \t]+[1-9][0-9]*)?|exit(?:[ \t]+0)?)[ \t]*(?:#[^\n]*)?$\n)(?>(?:(?!^ {12}(?! )sleep(?:[ \t]+|$))^ {12,}[^\n]*\n)){0,80}^ {12}(?! )sleep(?:[ \t]+|$)[^\n]*\n(?!(?>(?:(?!^ {12}(?! )(?:if\b|break(?:[ \t]+[1-9][0-9]*)?\b|exit(?:[ \t]+0)?\b)|^          done\b)^ {12,}[^\n]*\n)){0,40}^ {12}(?! )(?:break(?:[ \t]+[1-9][0-9]*)?|exit(?:[ \t]+0)?)[ \t]*(?:#[^\n]*)?$\n)(?>(?:(?!^          done\b)^ {12,}[^\n]*\n)){0,80}^          done\b'
    prefilter: [while, sleep]
    message: |
      This GitHub Actions job has a remote polling loop whose explicit retry
      limit covers transport failures but not the successful-no-result path.
      If the API stays reachable while the awaited verdict/state never appears,
      the job can retain a runner until an external platform limit, degrading
      availability of required review/security controls. Add a total wall-clock
      deadline or finite total-attempt guard checked on every polling path and
      fail closed. An explicit timeout anywhere on this same job can also bound
      the runner. A timeout/counter in a sibling job, command-like text in
      another run step, an echoed command string, or a shell comment is not
      evidence for this loop. Keep per-request transport timeouts as defense in
      depth; they do not replace the total polling bound.
    severity: HIGH
    languages: [generic]
    cwe: [CWE-400]
    owasp: [A04:2021]
    paths:
      include:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
