    prefilter: [while, sleep]
    message: |
      This GitHub Actions job bounds repeated transport failures from a remote
      API poll but leaves the healthy-transport/no-result path without a total
      termination bound. Renaming the retry counter or budget does not make the
      loop safe. Add a total wall-clock deadline, finite total-attempt budget,
      or explicit timeout on the same job and fail closed when it expires. A
      deadline or attempt limit only counts when its state is initialized before
      this same polling loop and the same state is consumed by the loop-local
      fail-closed guard. A bound consumed by an earlier helper loop does not
      sanitize a later poll, and a successful path that unconditionally breaks
      or exits zero before the back edge is finite rather than resource-retaining.
    severity: HIGH
    languages: [generic]
    cwe: [CWE-400]
    owasp: [A04:2021]
    paths:
      include:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"