rules:
  - id: python-ssrf-empty-host-fail-open
    patterns:
      - pattern-regex: '(?msx)^(?P<di>[ \t]*)(?:async[ \t]+)?def[ \t]+[A-Za-z_][A-Za-z0-9_]*[^\n]*:[ \t]*\n(?:(?!^(?P=di)(?:async[ \t]+)?def\b|^(?P=di)class\b).)*?^(?P<bi>(?P=di)[ \t]+)(?P<host>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*[^\n#]*\.hostname(?P<empty>[ \t]+or[ \t]*["\x27]["\x27])?[ \t]*\)?[ \t]*(?:\.lower[ \t]*\([ \t]*\))?[ \t]*(?:\#[^\n]*)?\n(?!(?:(?!^(?P=di)(?:async[ \t]+)?def\b|^(?P=di)class\b|^(?P=bi)return[ \t]+True\b).)*?^(?P=bi)if[ \t]+(?:\([ \t]*)?(?(empty)(?:not[ \t]+(?P=host)\b| (?P=host)[ \t]*==[ \t]*["\x27]["\x27]| (?P=host)[ \t]+in[ \t]*[\(\{\[][^:\n]*["\x27]["\x27][^:\n]*[\)\}\]])|(?:not[ \t]+(?P=host)\b| (?P=host)[ \t]*==[ \t]*["\x27]["\x27]| (?P=host)[ \t]+in[ \t]*[\(\{\[][^:\n]*["\x27]["\x27][^:\n]*[\)\}\]]| (?P=host)[ \t]+is[ \t]+None\b| (?P=host)[ \t]*==[ \t]*None\b| (?P=host)[ \t]+in[ \t]*[\(\{\[][^:\n]*None[^:\n]*[\)\}\]]))[ \t]*(?:\)[ \t]*)?(?:or\b[^\n:]*)?:(?:[ \t]*(?:return(?:[ \t]+(?:False|None|0(?:\.0+)?(?:[jJ])?|0[jJ]|""|\x27\x27|\(\s*\)|\[\s*\]|\{\s*\}|\([ \t]*(?:False|None|0(?:\.0+)?(?:[jJ])?|0[jJ]|""|\x27\x27|\(\s*\)|\[\s*\]|\{\s*\})[ \t]*\)))?[ \t]*(?:\#[^\n]*)?|raise\b[^\n]*)\n|[ \t]*(?:\#[^\n]*)?\n(?:^[ \t]*\n|^(?P=bi)[ \t]+\#[^\n]*\n){0,6}^(?P<gi>(?P=bi)[ \t]+)(?=\S)(?:(?:return(?:[ \t]+(?:False|None|0(?:\.0+)?(?:[jJ])?|0[jJ]|""|\x27\x27|\(\s*\)|\[\s*\]|\{\s*\}|\([ \t]*(?:False|None|0(?:\.0+)?(?:[jJ])?|0[jJ]|""|\x27\x27|\(\s*\)|\[\s*\]|\{\s*\})[ \t]*\)))?[ \t]*(?:\#[^\n]*)?|raise\b[^\n]*)\n|(?!(?:if|elif|else|for|while|try|except|finally|with|match|case|return|raise|break|continue|yield)\b)[^\n]*\n(?:(?:^[ \t]*\n|^(?P=gi)\#[^\n]*\n)|^(?P=gi)(?!(?:if|elif|else|for|while|try|except|finally|with|match|case|return|raise|break|continue|yield)\b)[^\n]*\n){0,6}^(?P=gi)(?:return(?:[ \t]+(?:False|None|0(?:\.0+)?(?:[jJ])?|0[jJ]|""|\x27\x27|\(\s*\)|\[\s*\]|\{\s*\}|\([ \t]*(?:False|None|0(?:\.0+)?(?:[jJ])?|0[jJ]|""|\x27\x27|\(\s*\)|\[\s*\]|\{\s*\})[ \t]*\)))?[ \t]*(?:\#[^\n]*)?|raise\b[^\n]*)\n)))(?=(?:(?:(?!^(?P=di)(?:async[ \t]+)?def\b|^(?P=di)class\b).)*?^(?P=bi)(?P<dns>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*(?P=host)\b[^\n]*\n(?:(?!^(?P=di)(?:async[ \t]+)?def\b|^(?P=di)class\b).)*?^[^\n]*\b(?:socket\.)?getaddrinfo[ \t]*\([ \t]*(?P=dns)\b[^\n]*\n|(?:(?!^(?P=di)(?:async[ \t]+)?def\b|^(?P=di)class\b).)*?^[^\n]*\b(?:socket\.)?getaddrinfo[ \t]*\([ \t]*(?P=host)\b[^\n]*\n)(?:(?!^(?P=di)(?:async[ \t]+)?def\b|^(?P=di)class\b).)*?^(?P=bi)except[ \t]+(?:(?:socket\.)?gaierror\b|\([^:\n]*(?:socket\.)?gaierror\b[^:\n]*\))[^\n:]*:[ \t]*(?:\#[^\n]*)?\n(?:^[ \t]*\n|^(?P=bi)[ \t]+\#[^\n]*\n){0,6}(?:^(?P<hi>(?P=bi)[ \t]+)(?=\S)return[ \t]+(?:True\b|\([ \t]*True[ \t]*\)|[1-9][0-9]*\b|\([ \t]*[1-9][0-9]*[ \t]*\))[^\n]*\n|^(?P<hi2>(?P=bi)[ \t]+)(?=\S)(?!(?:return|raise)\b)[^\n]*\n(?:^[ \t]*\n| ^(?P=hi2)\#[^\n]*\n| ^(?P=hi2)(?!(?:return|raise)\b)[^\n]*\n| ^(?P=hi2)[ \t]+[^\n]*\n){0,20}(?=^(?P=bi)\S)(?:(?!^(?P=di)(?:async[ \t]+)?def\b|^(?P=di)class\b|^(?P=bi)(?:return|raise)\b).)*?^(?P=bi)return[ \t]+(?:True\b|\([ \t]*True[ \t]*\)|[1-9][0-9]*\b|\([ \t]*[1-9][0-9]*[ \t]*\))[^\n]*\n?))(?:(?!^(?P=di)(?:async[ \t]+)?def\b|^(?P=di)class\b).)*?'
    message: |
      A Python URL validator can derive a missing or empty hostname, reach DNS
      resolution, ignore socket.gaierror, and later return success without an
      unconditional missing/empty-host rejection. Reject absent parsed hostnames
      before DNS resolution and fail closed when a safe public destination cannot
      be established.
      [CWE-918 - Server-Side Request Forgery]
    severity: HIGH
    languages: [python]
    prefilter: [hostname, getaddrinfo, gaierror]
    cwe: [CWE-918]
    owasp: [A10:2021]
