rules:
  # A nominal total bound is not fail-closed when control jumps to the loop back
  # edge before its nonzero exit. Keep this companion narrow: it proves the
  # directly reachable unreachable-exit path inside one conventional literal-shell
  # polling loop. `continue 0` is not a valid back edge. A statically positive
  # owning-job timeout literal or `${{ N }}` expression, or a direct bare exit,
  # suppresses the finding.
  - id: github-actions-poll-bound-unreachable-exit
    patterns:
      - pattern-regex: '^  [A-Za-z0-9_.-]+[^\n]*\n(?!(?>(?:(?!^(?:[A-Za-z0-9_.-]+|  [A-Za-z0-9_.-]+)[ \t]*:)[^\n]*\n))*^    timeout-minutes[ \t]*:[ \t]*(?:[1-9][0-9]*|\$\{\{[ \t]*[1-9][0-9]*[ \t]*\}\})[ \t]*(?:#[^\n]*)?$)(?>(?:(?!^      -[ \t]*run|^        run)^ {4,}[^\n]*\n)){0,80}^(?:      -[ \t]*run|        run)[ \t]*:[ \t]*\|[+-]?[^\n]*\n(?:(?!^          while[ \t])^ {10,}[^\n]*\n){0,100}?^          (?P<unreachable_deadline>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*\$\(\([^\n]*\bdate\b[^\n]*\+%s[^\n]*\+[ \t]*[1-9][0-9]*[ \t]*\)\)[ \t]*(?:#[^\n]*)?\n(?:(?!^          while[ \t])^ {10,}[^\n]*\n){0,80}?^          while[ \t]+(?::|true)[ \t]*;[ \t]*do[^\n]*\n(?>(?:(?!^ {12}(?! )if[^\n]*\bdate\b[^\n]*\+%s[^\n]*-(?:gt|ge)[^\n]*\$(?P=unreachable_deadline)\b[^\n]*;[ \t]*then|^          done\b)^ {12,}[^\n]*\n)){0,40}^ {12}(?! )if[^\n]*\bdate\b[^\n]*\+%s[^\n]*-(?:gt|ge)[^\n]*\$(?P=unreachable_deadline)\b[^\n]*;[ \t]*then[^\n]*\n(?>(?:(?!^ {14}(?! )(?:continue(?:[ \t]+1)?(?![ \t]*[0-9])|break(?:[ \t]+[1-9][0-9]*)?|exit(?:[ \t]+[0-9]+)?|return(?:[ \t]+[0-9]+)?)\b|^ {12}fi\b)^ {14,}[^\n]*\n)){0,8}^ {14}(?! )continue(?:[ \t]+1)?(?![ \t]*[0-9])\b[^\n]*\n(?>(?:(?!^ {14}(?! )exit[ \t]+[1-9][0-9]*\b|^ {12}fi\b)^ {14,}[^\n]*\n)){0,8}^ {14}(?! )exit[ \t]+[1-9][0-9]*\b[^\n]*\n(?>(?:(?!^ {12}fi\b)^ {14,}[^\n]*\n)){0,20}^ {12}fi[ \t]*(?:#[^\n]*)?\n(?>(?:(?!^ {12}(?! )(?:break(?:[ \t]+[1-9][0-9]*)?|exit(?:[ \t]+0)?)\b|^ {12,}(?:(?:if[ \t]+![ \t]+)?(?:[A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*)?["'']?\$\([ \t]*(?:timeout[ \t]+\S+[ \t]+)?gh[ \t]+api\b|(?:if[ \t]+![ \t]+)?(?:timeout[ \t]+\S+[ \t]+)?gh[ \t]+api\b)|^          done\b)^ {12,}[^\n]*\n)){0,80}^ {12,}(?:(?:if[ \t]+![ \t]+)?(?:[A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*)?["'']?\$\([ \t]*(?:timeout[ \t]+\S+[ \t]+)?gh[ \t]+api\b|(?:if[ \t]+![ \t]+)?(?:timeout[ \t]+\S+[ \t]+)?gh[ \t]+api\b)[^\n]*\n(?>(?:(?!^ {12}(?! )(?:break(?:[ \t]+[1-9][0-9]*)?|exit(?:[ \t]+0)?)\b|^ {12}(?! )sleep(?:[ \t]+|$)|^          done\b)^ {12,}[^\n]*\n)){0,80}^ {12}(?! )sleep(?:[ \t]+|$)[^\n]*\n^          done\b'
      - pattern-regex: '^  [A-Za-z0-9_.-]+[^\n]*\n(?!(?>(?:(?!^(?:[A-Za-z0-9_.-]+|  [A-Za-z0-9_.-]+)[ \t]*:)[^\n]*\n))*^    timeout-minutes[ \t]*:[ \t]*(?:[1-9][0-9]*|\$\{\{[ \t]*[1-9][0-9]*[ \t]*\}\})[ \t]*(?:#[^\n]*)?$)(?>(?:(?!^      -[ \t]*run|^        run)^ {4,}[^\n]*\n)){0,80}^(?:      -[ \t]*run|        run)[ \t]*:[ \t]*\|[+-]?[^\n]*\n(?:(?!^          while[ \t])^ {10,}[^\n]*\n){0,100}?^          (?P<unreachable_counter>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*0[ \t]*(?:#[^\n]*)?\n(?:(?!^          while[ \t])^ {10,}[^\n]*\n){0,40}?^          (?P<unreachable_limit>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*[1-9][0-9]*[ \t]*(?:#[^\n]*)?\n(?:(?!^          while[ \t])^ {10,}[^\n]*\n){0,80}?^          while[ \t]+(?::|true)[ \t]*;[ \t]*do[^\n]*\n(?>(?:(?!^ {12}(?! )(?P=unreachable_counter)[ \t]*=[ \t]*\$\(\([ \t]*(?P=unreachable_counter)[ \t]*\+[ \t]*1[ \t]*\)\)|^          done\b)^ {12,}[^\n]*\n)){0,40}^ {12}(?! )(?P=unreachable_counter)[ \t]*=[ \t]*\$\(\([ \t]*(?P=unreachable_counter)[ \t]*\+[ \t]*1[ \t]*\)\)[ \t]*(?:#[^\n]*)?\n(?>(?:(?!^ {12}(?! )if[^\n]*\$(?P=unreachable_counter)\b[^\n]*-(?:gt|ge)[^\n]*\$(?P=unreachable_limit)\b[^\n]*;[ \t]*then|^          done\b)^ {12,}[^\n]*\n)){0,20}^ {12}(?! )if[^\n]*\$(?P=unreachable_counter)\b[^\n]*-(?:gt|ge)[^\n]*\$(?P=unreachable_limit)\b[^\n]*;[ \t]*then[^\n]*\n(?>(?:(?!^ {14}(?! )(?:continue(?:[ \t]+1)?(?![ \t]*[0-9])|break(?:[ \t]+[1-9][0-9]*)?|exit(?:[ \t]+[0-9]+)?|return(?:[ \t]+[0-9]+)?)\b|^ {12}fi\b)^ {14,}[^\n]*\n)){0,8}^ {14}(?! )continue(?:[ \t]+1)?(?![ \t]*[0-9])\b[^\n]*\n(?>(?:(?!^ {14}(?! )exit[ \t]+[1-9][0-9]*\b|^ {12}fi\b)^ {14,}[^\n]*\n)){0,8}^ {14}(?! )exit[ \t]+[1-9][0-9]*\b[^\n]*\n(?>(?:(?!^ {12}fi\b)^ {14,}[^\n]*\n)){0,20}^ {12}fi[ \t]*(?:#[^\n]*)?\n(?>(?:(?!^ {12}(?! )(?:break(?:[ \t]+[1-9][0-9]*)?|exit(?:[ \t]+0)?)\b|^ {12,}(?:(?:if[ \t]+![ \t]+)?(?:[A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*)?["'']?\$\([ \t]*(?:timeout[ \t]+\S+[ \t]+)?gh[ \t]+api\b|(?:if[ \t]+![ \t]+)?(?:timeout[ \t]+\S+[ \t]+)?gh[ \t]+api\b)|^          done\b)^ {12,}[^\n]*\n)){0,80}^ {12,}(?:(?:if[ \t]+![ \t]+)?(?:[A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*)?["'']?\$\([ \t]*(?:timeout[ \t]+\S+[ \t]+)?gh[ \t]+api\b|(?:if[ \t]+![ \t]+)?(?:timeout[ \t]+\S+[ \t]+)?gh[ \t]+api\b)[^\n]*\n(?>(?:(?!^ {12}(?! )(?:break(?:[ \t]+[1-9][0-9]*)?|exit(?:[ \t]+0)?)\b|^ {12}(?! )sleep(?:[ \t]+|$)|^          done\b)^ {12,}[^\n]*\n)){0,80}^ {12}(?! )sleep(?:[ \t]+|$)[^\n]*\n^          done\b'
      - pattern-regex: '^  [A-Za-z0-9_.-]+[^\n]*\n(?!(?>(?:(?!^(?:[A-Za-z0-9_.-]+|  [A-Za-z0-9_.-]+)[ \t]*:)[^\n]*\n))*^    timeout-minutes[ \t]*:[ \t]*(?:[1-9][0-9]*|\$\{\{[ \t]*[1-9][0-9]*[ \t]*\}\})[ \t]*(?:#[^\n]*)?$)(?>(?:(?!^      -[ \t]*run|^        run)^ {4,}[^\n]*\n)){0,80}^(?:      -[ \t]*run|        run)[ \t]*:[ \t]*\|[+-]?[^\n]*\n(?:(?!^          while[ \t])^ {10,}[^\n]*\n){0,100}?^          (?P<unreachable_limit_first>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*[1-9][0-9]*[ \t]*(?:#[^\n]*)?\n(?:(?!^          while[ \t])^ {10,}[^\n]*\n){0,40}?^          (?P<unreachable_counter_second>[A-Za-z_][A-Za-z0-9_]*)[ \t]*=[ \t]*0[ \t]*(?:#[^\n]*)?\n(?:(?!^          while[ \t])^ {10,}[^\n]*\n){0,80}?^          while[ \t]+(?::|true)[ \t]*;[ \t]*do[^\n]*\n(?>(?:(?!^ {12}(?! )(?P=unreachable_counter_second)[ \t]*=[ \t]*\$\(\([ \t]*(?P=unreachable_counter_second)[ \t]*\+[ \t]*1[ \t]*\)\)|^          done\b)^ {12,}[^\n]*\n)){0,40}^ {12}(?! )(?P=unreachable_counter_second)[ \t]*=[ \t]*\$\(\([ \t]*(?P=unreachable_counter_second)[ \t]*\+[ \t]*1[ \t]*\)\)[ \t]*(?:#[^\n]*)?\n(?>(?:(?!^ {12}(?! )if[^\n]*\$(?P=unreachable_counter_second)\b[^\n]*-(?:gt|ge)[^\n]*\$(?P=unreachable_limit_first)\b[^\n]*;[ \t]*then|^          done\b)^ {12,}[^\n]*\n)){0,20}^ {12}(?! )if[^\n]*\$(?P=unreachable_counter_second)\b[^\n]*-(?:gt|ge)[^\n]*\$(?P=unreachable_limit_first)\b[^\n]*;[ \t]*then[^\n]*\n(?>(?:(?!^ {14}(?! )(?:continue(?:[ \t]+1)?(?![ \t]*[0-9])|break(?:[ \t]+[1-9][0-9]*)?|exit(?:[ \t]+[0-9]+)?|return(?:[ \t]+[0-9]+)?)\b|^ {12}fi\b)^ {14,}[^\n]*\n)){0,8}^ {14}(?! )continue(?:[ \t]+1)?(?![ \t]*[0-9])\b[^\n]*\n(?>(?:(?!^ {14}(?! )exit[ \t]+[1-9][0-9]*\b|^ {12}fi\b)^ {14,}[^\n]*\n)){0,8}^ {14}(?! )exit[ \t]+[1-9][0-9]*\b[^\n]*\n(?>(?:(?!^ {12}fi\b)^ {14,}[^\n]*\n)){0,20}^ {12}fi[ \t]*(?:#[^\n]*)?\n(?>(?:(?!^ {12}(?! )(?:break(?:[ \t]+[1-9][0-9]*)?|exit(?:[ \t]+0)?)\b|^ {12,}(?:(?:if[ \t]+![ \t]+)?(?:[A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*)?["'']?\$\([ \t]*(?:timeout[ \t]+\S+[ \t]+)?gh[ \t]+api\b|(?:if[ \t]+![ \t]+)?(?:timeout[ \t]+\S+[ \t]+)?gh[ \t]+api\b)|^          done\b)^ {12,}[^\n]*\n)){0,80}^ {12,}(?:(?:if[ \t]+![ \t]+)?(?:[A-Za-z_][A-Za-z0-9_]*[ \t]*=[ \t]*)?["'']?\$\([ \t]*(?:timeout[ \t]+\S+[ \t]+)?gh[ \t]+api\b|(?:if[ \t]+![ \t]+)?(?:timeout[ \t]+\S+[ \t]+)?gh[ \t]+api\b)[^\n]*\n(?>(?:(?!^ {12}(?! )(?:break(?:[ \t]+[1-9][0-9]*)?|exit(?:[ \t]+0)?)\b|^ {12}(?! )sleep(?:[ \t]+|$)|^          done\b)^ {12,}[^\n]*\n)){0,80}^ {12}(?! )sleep(?:[ \t]+|$)[^\n]*\n^          done\b'
    prefilter: [while, sleep]
    message: |
      This GitHub Actions polling loop has an apparent total deadline or attempt
      bound whose nonzero fail-closed exit is unreachable because a directly
      reachable unconditional continue transfers control to the loop back edge first.
      The polling command therefore remains repeatable on the reviewed path. Move
      the fail-closed exit before any continue, or use an owning-job timeout as an
      independent hard bound.
    severity: HIGH
    languages: [generic]
    cwe: [CWE-400]
    owasp: [A04:2021]
    paths:
      include:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"